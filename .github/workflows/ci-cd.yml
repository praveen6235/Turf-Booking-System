name: Turf Booking System CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Auth Service
        run: |
          cd services/auth-service
          npm install
          npm test

      - name: Test Turf Service
        run: |
          cd services/turf-service
          npm install
          npm test

      - name: Test Booking Service
        run: |
          cd services/booking-service
          npm install
          npm test

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      turf: ${{ steps.filter.outputs.turf }}
      booking: ${{ steps.filter.outputs.booking }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      webhook: ${{ steps.filter.outputs.webhook }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
            turf:
              - 'services/turf-service/**'
            booking:
              - 'services/booking-service/**'
            gateway:
              - 'services/api-gateway/**'
            frontend:
              - 'services/frontend-service/**'
            webhook:
              - 'services/webhook-service/**'

  build-and-deploy:
    name: Build, Security Scan & Deploy
    needs: [lint-and-test, detect-changes]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::874244580817:role/TurfGitHubActionsRole
          aws-region: ap-south-1
          role-session-name: GitHubActionsCI

      - name: Login to Amazon ECR
        id: login-ecr
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@v2

      # Build & Push Auth Service
      - name: Build & Push Auth Service
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="${REGISTRY:+${REGISTRY}/}turf-booking/auth-service"
          docker build -t ${TARGET_IMAGE}:${{ github.sha }} ./services/auth-service
          docker tag ${TARGET_IMAGE}:${{ github.sha }} ${TARGET_IMAGE}:latest
          if [ -n "$REGISTRY" ]; then
            docker push ${TARGET_IMAGE}:${{ github.sha }} || true
            docker push ${TARGET_IMAGE}:latest || true
          fi

      # Build & Push Turf Service
      - name: Build & Push Turf Service
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="${REGISTRY:+${REGISTRY}/}turf-booking/turf-service"
          docker build -t ${TARGET_IMAGE}:${{ github.sha }} ./services/turf-service
          docker tag ${TARGET_IMAGE}:${{ github.sha }} ${TARGET_IMAGE}:latest
          if [ -n "$REGISTRY" ]; then
            docker push ${TARGET_IMAGE}:${{ github.sha }} || true
            docker push ${TARGET_IMAGE}:latest || true
          fi

      # Build & Push Booking Service
      - name: Build & Push Booking Service
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="${REGISTRY:+${REGISTRY}/}turf-booking/booking-service"
          docker build -t ${TARGET_IMAGE}:${{ github.sha }} ./services/booking-service
          docker tag ${TARGET_IMAGE}:${{ github.sha }} ${TARGET_IMAGE}:latest
          if [ -n "$REGISTRY" ]; then
            docker push ${TARGET_IMAGE}:${{ github.sha }} || true
            docker push ${TARGET_IMAGE}:latest || true
          fi

      # Build & Push Frontend Service
      - name: Build & Push Frontend Service
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TARGET_IMAGE="${REGISTRY:+${REGISTRY}/}turf-booking/frontend-service"
          docker build -t ${TARGET_IMAGE}:${{ github.sha }} ./services/frontend-service
          docker tag ${TARGET_IMAGE}:${{ github.sha }} ${TARGET_IMAGE}:latest
          if [ -n "$REGISTRY" ]; then
            docker push ${TARGET_IMAGE}:${{ github.sha }} || true
            docker push ${TARGET_IMAGE}:latest || true
          fi

      # Security Vulnerability Scan with Trivy
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry && format(''{0}/'', steps.login-ecr.outputs.registry) || '''' }}turf-booking/auth-service:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Validate & Deploy to Kubernetes
      - name: Deploy to Kubernetes Cluster
        run: |
          echo "Validating Kubernetes manifests..."
          kubectl apply --dry-run=client -k k8s/base
          echo "Manifests validated successfully."

      - name: Notify webhook
        if: env.WEBHOOK_URL != ''
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_SERVICE_URL }}
        run: |
          BODY="{\"ref\":\"refs/heads/main\",\"after\":\"${{ github.sha }}\"}"
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          curl -X POST "$WEBHOOK_URL/webhook/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$BODY"
