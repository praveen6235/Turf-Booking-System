apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: turf-booking-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: turf-booking-system
data:
  dashboards-provider.yaml: |
    apiVersion: 1
    providers:
    - name: 'Turf Booking Dashboards'
      orgId: 1
      folder: 'Turf Booking System'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
        foldersFromFilesStructure: true
