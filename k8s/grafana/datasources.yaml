apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: turf-booking-system
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: turf-booking-system
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
        timeInterval: 5s
