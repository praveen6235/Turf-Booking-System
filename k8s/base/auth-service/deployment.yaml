apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: turf-booking-system
  labels:
    app: auth-service
    service: auth-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        service: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: auth-service
        image: turf-booking/auth-service:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5001
          name: http
        env:
        - name: PORT
          value: "5001"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: turf-config
              key: NODE_ENV
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: turf-secrets
              key: AUTH_MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: turf-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            secretKeyRef:
              name: turf-secrets
              key: JWT_EXPIRES_IN
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: turf-secrets
              key: GOOGLE_CLIENT_ID
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
