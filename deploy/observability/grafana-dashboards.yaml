apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-microservices-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  turf-microservices-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Per-Microservice Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m])) by (service)",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "title": "Per-Microservice Latency 95th Percentile (seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le, service))",
              "legendFormat": "{{service}} (p95)"
            }
          ]
        },
        {
          "title": "Per-Microservice Error Rate (5xx / Total)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status_code=~\"5..\"}[1m])) by (service) / sum(rate(http_requests_total[1m])) by (service)",
              "legendFormat": "{{service}} error rate"
            }
          ]
        },
        {
          "title": "Pod Count vs Request Rate per Service (Autoscaling Visualizer)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{condition=\"true\"}) by (namespace, pod)",
              "legendFormat": "Pods: {{pod}}"
            },
            {
              "expr": "sum(rate(http_requests_total[1m])) by (service)",
              "legendFormat": "Traffic: {{service}}"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["microservices", "turf-booking"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "Turf Booking System - Microservices Observability Dashboard"
    }
