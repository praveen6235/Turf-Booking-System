apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "5004"
  MONGODB_URI: "mongodb://mongodb-service:27017/turf_booking"
  TURF_SERVICE_URL: "http://turf-service:5003"
---
apiVersion: v1
kind: Secret
metadata:
  name: booking-service-secret
  namespace: default
type: Opaque
stringData:
  JWT_SECRET: "change_me_in_production_jwt_secret"
  RAZORPAY_KEY_ID: "rzp_test_123456789"
  RAZORPAY_KEY_SECRET: "dummy_secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: default
  labels:
    app: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/turf-booking/booking-service:latest
          ports:
            - containerPort: 5004
          envFrom:
            - configMapRef:
                name: booking-service-config
            - secretRef:
                name: booking-service-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: default
  labels:
    app: booking-service
spec:
  type: ClusterIP
  ports:
    - port: 5004
      targetPort: 5004
      name: http
  selector:
    app: booking-service
