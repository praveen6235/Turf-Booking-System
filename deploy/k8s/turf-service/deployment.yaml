apiVersion: v1
kind: ConfigMap
metadata:
  name: turf-service-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "5003"
  MONGODB_URI: "mongodb://mongodb-service:27017/turf_turf"
  MEDIA_SERVICE_URL: "http://media-service:5005"
---
apiVersion: v1
kind: Secret
metadata:
  name: turf-service-secret
  namespace: default
type: Opaque
stringData:
  JWT_SECRET: "change_me_in_production_jwt_secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turf-service
  namespace: default
  labels:
    app: turf-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: turf-service
  template:
    metadata:
      labels:
        app: turf-service
    spec:
      containers:
        - name: turf-service
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/turf-booking/turf-service:latest
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: turf-service-config
            - secretRef:
                name: turf-service-secret
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: turf-service
  namespace: default
  labels:
    app: turf-service
spec:
  type: ClusterIP
  ports:
    - port: 5003
      targetPort: 5003
      name: http
  selector:
    app: turf-service
