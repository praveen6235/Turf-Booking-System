apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: turf-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: turf-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: External
      external:
        metric:
          name: turf_search_requests_per_second
        target:
          type: AverageValue
          averageValue: "40"
