apiVersion: v1
kind: ConfigMap
metadata:
  name: media-service-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "5005"
---
apiVersion: v1
kind: Secret
metadata:
  name: media-service-secret
  namespace: default
type: Opaque
stringData:
  JWT_SECRET: "change_me_in_production_jwt_secret"
  CLOUDINARY_CLOUD_NAME: "dummy_cloud_name"
  CLOUDINARY_API_KEY: "dummy_api_key"
  CLOUDINARY_API_SECRET: "dummy_api_secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: default
  labels:
    app: media-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
        - name: media-service
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/turf-booking/media-service:latest
          ports:
            - containerPort: 5005
          envFrom:
            - configMapRef:
                name: media-service-config
            - secretRef:
                name: media-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: default
  labels:
    app: media-service
spec:
  type: ClusterIP
  ports:
    - port: 5005
      targetPort: 5005
      name: http
  selector:
    app: media-service
